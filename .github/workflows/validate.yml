name: Validate scripts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n core/generate.sh
          bash -n core/xray_logs.sh
          bash -n core/xray_mkcp_compat.sh
          bash -n core/handler.sh
          bash -n core/main.sh
          bash -n core/menu.sh
          bash -n core/read.sh
          bash -n core/operations.sh
          bash -n core/bbr.sh
          bash -n core/host_tuning.sh
          bash -n core/clash.sh
          bash -n core/clash_multi.sh
          bash -n service/docker.sh

      - name: JSON syntax
        run: |
          jq empty config.json
          jq empty i18n/zh.json
          jq empty i18n/en.json
          for file in config/xray/*.json; do jq empty "$file"; done

      - name: Python syntax
        run: python3 -m py_compile core/clash_http_server.py core/clash_multi.py core/clash_shadowrocket.py tests/test_clash_multi.py tests/test_clash_shadowrocket.py

      - name: Multi-server subscription regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Non-root Xray logfile ownership and backup integration
        run: sudo python3 -m unittest discover -s tests -p 'test_xray_file_logs.py' -v

  xray-real-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["v26.3.27", "v26.10.21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download pinned official Xray-core
        run: |
          curl --fail --location --retry 3 --connect-timeout 10 \
            --max-time 180 -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${{ matrix.version }}/Xray-linux-64.zip"
          mkdir -p xray-bin
          unzip -q xray.zip -d xray-bin
          chmod +x xray-bin/xray
          ./xray-bin/xray version
      - name: Validate all protocol templates and short-lived service startup
        run: |
          python3 tests/check_real_xray_templates.py ./xray-bin/xray
          python3 tests/check_real_xray_apply.py ./xray-bin/xray
